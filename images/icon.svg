<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Icône du plugin : un objectif photo (GPose) dont l'image est coupée en deux, couleurs normales à gauche et filtre
       sépia à droite, avec le curseur d'intensité dessous. Même fond que les autres plugins. -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22324f"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d3e3"/>
      <stop offset="1" stop-color="#5d6b82"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset="1" stop-color="#e0a93b"/>
    </linearGradient>
    <linearGradient id="skyColor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8fe0"/>
      <stop offset="1" stop-color="#a9dbff"/>
    </linearGradient>
    <linearGradient id="skySepia" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a77d4a"/>
      <stop offset="1" stop-color="#ead2a2"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <!-- Le verre de l'objectif. -->
    <clipPath id="lens">
      <circle cx="256" cy="232" r="136"/>
    </clipPath>
    <!-- Les deux moitiés de l'image, de part et d'autre d'une diagonale. -->
    <clipPath id="leftHalf">
      <polygon points="0,0 330,0 182,512 0,512"/>
    </clipPath>
    <clipPath id="rightHalf">
      <polygon points="330,0 512,0 512,512 182,512"/>
    </clipPath>
  </defs>

  <!-- Fond -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#background)"/>

  <!-- Monture de l'objectif -->
  <circle cx="256" cy="232" r="172" fill="#1b2335" stroke="url(#metal)" stroke-width="14" filter="url(#shadow)"/>
  <circle cx="256" cy="232" r="148" fill="none" stroke="#2c3850" stroke-width="10"/>

  <!-- L'image vue à travers l'objectif -->
  <g clip-path="url(#lens)">
    <!-- En couleurs -->
    <g clip-path="url(#leftHalf)">
      <rect x="96" y="80" width="320" height="320" fill="url(#skyColor)"/>
      <circle cx="318" cy="168" r="34" fill="#ffd34d"/>
      <path d="M 96 312 L 196 196 L 262 270 L 318 214 L 416 312 V 400 H 96 Z" fill="#3f9a63"/>
      <path d="M 96 330 Q 256 290 416 336 V 400 H 96 Z" fill="#2c7547"/>
    </g>
    <!-- Avec le filtre -->
    <g clip-path="url(#rightHalf)">
      <rect x="96" y="80" width="320" height="320" fill="url(#skySepia)"/>
      <circle cx="318" cy="168" r="34" fill="#fff0c9"/>
      <path d="M 96 312 L 196 196 L 262 270 L 318 214 L 416 312 V 400 H 96 Z" fill="#8c6a40"/>
      <path d="M 96 330 Q 256 290 416 336 V 400 H 96 Z" fill="#6a4c2b"/>
    </g>
    <!-- La limite entre les deux -->
    <path d="M 330 0 L 182 512" stroke="#ffffff" stroke-width="6" stroke-opacity="0.85"/>
    <!-- Reflet sur le verre -->
    <path d="M 160 160 A 120 120 0 0 1 250 110" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-opacity="0.35"/>
  </g>

  <!-- Curseur d'intensité (couleur pleine : un dégradé sur une ligne droite ne se dessine pas) -->
  <path d="M 140 450 H 372" stroke="#3a4866" stroke-width="14" stroke-linecap="round"/>
  <path d="M 140 450 H 304" stroke="#e8b84a" stroke-width="14" stroke-linecap="round"/>
  <circle cx="304" cy="450" r="22" fill="url(#gold)" filter="url(#shadow)"/>
</svg>
